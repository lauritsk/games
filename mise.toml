[env]
HK_MISE = 1

[tools]
node = "26.1.0"
pnpm = "11.1.1"
vp = "0.1.21"
hk = "1.44.3"
pkl = "0.31.1"
"npm:oxlint" = "1.61.0"
"npm:oxfmt" = "0.46.0"
cocogitto = "7.0.0"
tombi = "0.10.4"

[hooks]
postinstall = "hk install --mise"

[tasks.dev]
description = "Run the web app dev server"
run = "vp run dev"

[tasks.install]
description = "Install dependencies with pnpm"
run = "vp install --frozen-lockfile"

[tasks.ci]
description = "Install dependencies with pnpm's frozen lockfile"
run = "vp install --frozen-lockfile"

[tasks."db:migrate"]
description = "Create or migrate the SQLite sync database"
run = "vp exec tsx src/server/migrate.ts"

[tasks."db:generate"]
description = "Generate Drizzle SQLite migrations"
run = "vp exec drizzle-kit generate"

[tasks.build]
description = "Build the web app"
run = "vp build"

[tasks."build:analyze"]
description = "Build the web app and write bundle reports"
run = "vp run build:analyze"

[tasks."build:production"]
description = "Build the fullstack Node production bundle"
run = "vp run build:production"

[tasks."build:single"]
description = "Build the web app as one standalone HTML file"
run = "vp run build:single"

[tasks."build:server"]
description = "Build the Node server bundle into a temporary directory"
run = "vp run build:server"

[tasks.lint]
description = "Run hk-managed checks across the repository"
run = "hk check --all"

[tasks.fix]
description = "Run hk-managed fixers across the repository"
run = "hk fix --all"

[tasks.typecheck]
description = "Run TypeScript type checks"
run = "vp run typecheck"

[tasks.test]
description = "Run tests"
run = "vp test run test/*.test.ts"

[tasks."test:changed"]
description = "Run tests affected by changed files"
run = "vp test run --changed"

[tasks."test:coverage"]
description = "Run tests with coverage reports"
run = "vp run test:coverage"

[tasks.audit]
description = "Run pnpm package audit"
run = "vp run audit"

[tasks."docs:api"]
description = "Generate API docs from Valibot-backed contracts"
run = "vp run docs:api"

[tasks."test:e2e"]
description = "Run Playwright browser tests"
depends = ["build"]
run = "vp run test:e2e"

[tasks."test:watch"]
description = "Run tests in watch mode"
run = "vp test watch test/*.test.ts"

[tasks."docker:push"]
description = "Build and push latest multi-arch Docker image to Docker Hub"
run = "docker buildx build --platform linux/amd64,linux/arm64 --build-arg NODE_VERSION=$(mise current node) -t docker.io/lauritsk/games:latest --push ."

[tasks."docker:up"]
description = "Run Docker Compose with Node version from mise"
run = "NODE_VERSION=$(mise current node) docker compose up --build"

[tasks.check]
description = "Run version check, hk checks, tests, and build"
depends = ["lint", "test", "build", "build:server", "test:e2e"]
